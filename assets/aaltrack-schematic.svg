<text x="243" y="149" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#27638c">Full self-</text>
<text x="243" y="168" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#27638c">attention</text>
<rect x="180" y="243" width="126" height="94" rx="9" fill="#fff" stroke="#c38959" stroke-width="2"/>
