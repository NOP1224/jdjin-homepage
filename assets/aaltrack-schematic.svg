<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
<title id="title">AALTrack alternating attention schematic</title>
<desc id="desc">RGB and thermal branches alternate full self-attention and predicted attention, share cross-modal guidance, and feed a tracking head. This is a simplified schematic, not a figure reproduced from the paper.</desc>
